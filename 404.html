<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="5;url=/">
<title>404 · teecatt</title>
<style>
:root{--bg:#0d1117;--surface:#161b22;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--violet:#c822ff}
*{margin:0;padding:0;box-sizing:border-box}
*{-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center}
.code{font-size:52px;font-weight:800;letter-spacing:-.02em;background:linear-gradient(120deg,var(--accent),var(--violet));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.msg{margin-top:12px;font-size:14px;color:var(--muted);line-height:1.7}
.countdown{margin-top:12px;font-size:12px;color:var(--accent);font-variant-numeric:tabular-nums}
.links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px;max-width:640px}
.links a{display:inline-flex;align-items:center;padding:6px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--text);text-decoration:none;background:var(--surface);transition:border-color .15s,transform .15s}
.links a:hover{border-color:var(--accent);transform:translateY(-1px)}
.links a:active{opacity:.8}
footer{margin-top:26px;font-size:11px;color:rgba(139,148,158,.6)}
</style>
</head>
<body>
<div class="code">404</div>
<p class="msg">404 页面不存在或已被移动。下面是从主页实时同步的入口：</p>
<div class="countdown">将在 <span id="sec">5</span> 秒后自动返回首页</div>
<div class="links" id="links"></div>
<footer>teecatt · GitHub Pages</footer>
<script>
/* 实时从主页解析卡片，生成 mini 入口 */
(async function(){
  var box=document.getElementById('links');
  function abs(h){ try{ return new URL(h, location.origin+'/').href; }catch(e){ return h; } }
  function add(href,title){ var a=document.createElement('a'); a.href=href; a.textContent=title; box.appendChild(a); }
  try{
    var res=await fetch('/',{cache:'no-store'});
    if(!res.ok) throw new Error(res.status);
    var doc=new DOMParser().parseFromString(await res.text(),'text/html');
    doc.querySelectorAll('.card').forEach(function(card){
      var link=card.matches('a.card')?card:card.querySelector('a.card-body, a.go, a');
      if(!link) return;
      var href=link.getAttribute('href'); if(!href) return;
      var h2=card.querySelector('h2');
      var title=h2?h2.textContent.replace(/在线版|NEW/g,'').trim():href;
      add(abs(href),title);
    });
    if(!box.children.length) throw new Error('empty');
  }catch(e){ add('/','返回首页'); }
})();
/* 5 秒倒计时自动回主站 */
(function(){
  var el=document.getElementById('sec'); if(!el) return;
  var left=5;
  var t=setInterval(function(){
    left--;
    if(left<=0){ clearInterval(t); location.href='/'; return; }
    el.textContent=left;
  },1000);
})();
</script>
</body>
</html>
