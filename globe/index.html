<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>访客地图 · teecatt</title>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="dns-prefetch" href="https://gcore.jsdelivr.net">
<link rel="dns-prefetch" href="https://testingcf.jsdelivr.net">
<link rel="dns-prefetch" href="https://ghfast.top">
<style>
:root{--bg:#000;--panel:#0d1117cc;--line:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--hover:#21262d}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',Helvetica,Arial,sans-serif}
#globe{position:fixed;inset:0}

header{position:fixed;top:0;left:0;padding:16px 18px;z-index:10}
header h1{font-size:15px;font-weight:600;letter-spacing:.5px;text-shadow:0 1px 8px #000}

#panel{position:fixed;top:0;right:0;width:340px;height:100%;z-index:9;display:flex;flex-direction:column;pointer-events:none}
.panelbox{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:rgba(13,17,23,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-left:1px solid var(--line);margin-top:20px;pointer-events:auto;transition:transform .3s ease}
#panel.collapsed .panelbox{transform:translateY(100%);pointer-events:none}
.chev{position:absolute;top:-20px;left:0;z-index:12;width:100%;height:20px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);background:none;border:none;cursor:pointer;transition:color .15s;pointer-events:auto;outline:none}
.chev:hover{color:var(--text)}
.chev:focus{outline:none;box-shadow:none}
.chev svg{width:60px;height:9px;transition:transform .25s ease}
.chev.up svg{transform:rotate(180deg)}

.sum{position:relative;padding:16px 76px 12px 18px;border-bottom:1px solid var(--line)}
.total-row{display:flex;align-items:center;gap:8px}
.sum .total{display:inline-flex;align-items:flex-end;gap:4px;font-size:20px;font-weight:700;color:var(--accent)}
.sum .total .unit{font-size:11px;font-weight:400;color:var(--muted);line-height:1.7}
.lang{position:absolute;right:14px;top:0;bottom:0;margin:auto 0;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;transition:color .15s}
.lang:hover{color:var(--text)}
.lang:focus{outline:none;box-shadow:none}
.lang.on{color:var(--accent)}
.lang svg{width:24px;height:24px;display:block}
.sum .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sum .note{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.45}
.gps{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;transition:color .15s;flex:0 0 auto}
.gps:hover{color:var(--text)}
.gps:focus{outline:none;box-shadow:none}
.gps.on{color:var(--accent)}
.gps.on:hover{color:var(--accent)}
.gps svg{width:18px;height:18px;display:block}
.gps-corner{position:fixed;top:6px;right:13px;z-index:13;width:46px;height:46px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:none;border:none;cursor:pointer;padding:0;outline:none;transition:color .15s,transform .15s}
.gps-corner:hover{color:var(--text);transform:scale(1.06)}
.gps-corner.on,.gps-corner.on:hover{color:var(--accent)}
.gps-corner:focus{outline:none}
.gps-corner svg{width:26px;height:26px;display:block}
.mecity{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

#list{flex:1;overflow-y:auto;padding:0 10px 20px}
.sec{font-size:11px;color:var(--muted);letter-spacing:1px;padding:14px 10px 6px;text-transform:uppercase}
.row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .15s;box-sizing:border-box;height:54px}
.row:hover{background:var(--hover)}
.row.sel{background:rgba(88,166,255,.16)}
.row.sel .dot{box-shadow:0 0 0 2px rgba(88,166,255,.5)}
.row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.row .t{flex:1;min-width:0;display:flex;flex-direction:column}
.row .t .n{font-size:13px;line-height:18px;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 0 auto}
.row .t .n::-webkit-scrollbar{display:none}
.row .t .s{font-size:11px;line-height:15px;color:var(--muted);white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;flex:0 0 auto;margin-top:3px}
.row .t .s::-webkit-scrollbar{display:none}
.row .c{font-size:12px;color:var(--accent);font-weight:600;flex:0 0 auto}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:40px 20px;line-height:1.8}

.map-label{pointer-events:none;transition:opacity .12s ease}
.map-label.gl-hide{opacity:0}
.map-label .ml-box{transform:translateY(calc(-50% - 5px));background:none;border:none;border-radius:0;padding:2px 4px;white-space:nowrap;text-align:center;box-shadow:none}
.map-label .ml-top{font-size:13px;font-weight:600;color:#fff;text-shadow:0 1px 8px #000,0 0 2px #000}
.map-label .ml-top .ml-n{color:var(--accent);text-shadow:0 1px 8px #000}
.map-label .ml-sub{font-size:11px;color:#e6edf3;margin-top:2px;text-shadow:0 1px 6px #000}

@media(max-width:720px){
  #panel{top:auto;bottom:0;width:100%;height:65%}
  .panelbox{border-left:none;border-top:1px solid var(--line)}
  .sum{padding:16px 72px 10px 18px}
  .sum .total{font-size:18px}
  header h1{display:none}
}
</style>
</head>
<body>
<div id="globe"></div>
<header><h1>访客地图</h1></header>
<aside id="panel">
  <div class="panelbox">
  <button class="chev" id="chev" title="收起 / 展开" aria-label="toggle panel">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square" stroke-linejoin="miter"><polyline points="2,2 12,12 22,2"/></svg>
  </button>
  <div class="sum">
    <div class="total-row">
      <div class="total"><span id="total">—</span><span class="unit" id="unit">visits</span></div>
      <button class="gps" id="gps" title="Locate me" aria-label="locate me"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path fill="currentColor" d="M6 .5A4.5 4.5 0 0 1 10.5 5c0 1.863-1.42 3.815-4.2 5.9a.5.5 0 0 1-.6 0C2.92 8.815 1.5 6.863 1.5 5A4.5 4.5 0 0 1 6 .5m0 3a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3"/></svg></button>
      <span class="mecity" id="mecity"></span>
    </div>
    <div class="sub"><span id="sub">Loading…</span></div>
    <div class="note" id="sub-note"></div>
    <button class="lang" id="lang" title="Translate to 中文" aria-label="translate"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M48 112h288M192 64v48m80 336l96-224l96 224m-162.5-64h133M281.3 112S257 206 199 277S80 384 80 384"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M256 336s-35-27-72-75s-56-85-56-85"/></svg></button>
  </div>
  <div id="list"><div class="empty">Loading…</div></div>
  </div>
</aside>
<button class="gps-corner" id="gps-corner" title="Locate me" aria-label="locate me"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12"><path fill="currentColor" d="M6 .5A4.5 4.5 0 0 1 10.5 5c0 1.863-1.42 3.815-4.2 5.9a.5.5 0 0 1-.6 0C2.92 8.815 1.5 6.863 1.5 5A4.5 4.5 0 0 1 6 .5m0 3a1.5 1.5 0 1 0 0 3a1.5 1.5 0 0 0 0-3"/></svg></button>

<script src="../shared/cdn-race.js?v=dev"></script>
<script src="../shared/visitor.js?v=dev"></script>
<script src="../shared/label-collide.js?v=dev"></script>
<script>
var COLORS = Visitor.COLORS;
var _regionNames;
function trCountry(code,fallback){
  if(lang!=='zh' || !code) return fallback||code||'';
  try{ _regionNames=_regionNames||new Intl.DisplayNames(['zh-Hans'],{type:'region'}); return _regionNames.of(code)||fallback||code; }catch(e){ return fallback||code; }
}
function zhCity(o){ if(lang!=='zh') return o.city||''; return o.city_zh||o.city||''; }
function zhRegion(o){
  if(lang!=='zh') return o.region||'';
  var r=o.region_zh;
  if(!r && o.region){
    for(var i=0;i<cities.length;i++){
      if(cities[i].country===o.country && cities[i].region===o.region && cities[i].region_zh){ r=cities[i].region_zh; break; }
    }
  }
  return r||o.region||'';
}
var flag = Visitor.flag;
function nameOf(v){ var c=zhCity(v), r=zhRegion(v), k=trCountry(v.country,v.country); return c||r||k||'?'; }
function subOf(v,nm){ var seg=[]; var r=zhRegion(v)||zhCity(v)||v.city||''; var k=trCountry(v.country,v.country), f=flag(v.country); if(r) seg.push(r); if(k) seg.push(k+(f?' '+f:'')); return seg.join(' · '); }

var colorFor = Visitor.colorFor;
var esc = Visitor.esc;
function full(ts){ try{ return new Date(ts).toLocaleString(lang==='zh'?'zh-CN':'en-GB',{hour12:false}); }catch(e){ return new Date(ts).toISOString(); } }
var rowKey = Visitor.rowKey;
function isSel(o){ return selKey!=null && o && rowKey(o)===selKey; }

/* 管理员密钥不再走 URL query（会进入浏览器历史、Referer 与服务器日志）。
   使用方式：首次访问 /globe/#admin 输入一次，密钥只保存在 sessionStorage，随后地址栏不再携带。 */
var adminKey = '';
try{ adminKey = sessionStorage.getItem('tc_admin_key') || ''; }catch(e){}
if(location.hash === '#admin' && !adminKey){
  var _adminInput = prompt('请输入管理员密钥（仅保存在本次会话）：');
  if(_adminInput){ adminKey = _adminInput; try{ sessionStorage.setItem('tc_admin_key', _adminInput); }catch(e){} }
  history.replaceState(null, '', location.pathname + location.search);
}
var lang = 'en';
var globe, cities=[], adminVisits=[], meData=null, selKey=null, selCity=null, collapsed=false, ASSET_TEX={}, allLabels=true;

function initGlobe(){
  globe = Globe()(document.getElementById('globe'))
    .globeImageUrl(ASSET_TEX['earth-blue-marble.jpg']||'./textures/earth-blue-marble.jpg')
    .bumpImageUrl(ASSET_TEX['earth-topology.png']||'./textures/earth-topology.png')
    .backgroundImageUrl(ASSET_TEX['night-sky.png']||'./textures/night-sky.png')
    .showAtmosphere(true)
    .atmosphereColor('#7fb8ff')
    .atmosphereAltitude(0.22)
    .pointLat('lat').pointLng('lon')
    .pointAltitude(function(d){ return 0.01 + Math.log2((d.n||1)+1) * 0.015; })
    .pointRadius(0.25)
    .pointColor(function(d){ return colorFor(d.country || d.region); })
    .pointsTransitionDuration(250)
    .ringLat('lat').ringLng('lng')
    .ringColor(function(){ return function(t){ return 'rgba(88,166,255,'+(1-t).toFixed(3)+')'; }; })
    .ringMaxRadius(4)
    .ringPropagationSpeed(3)
    .ringRepeatPeriod(800)
    .ringAltitude(0.011)
    .htmlLat('lat').htmlLng('lon').htmlAltitude(0.06)
    .htmlElement(function(d){
      var el=document.createElement('div');
      el.className='map-label';
      el.__d=d;
      el.innerHTML='<div class="ml-box"><div class="ml-top">'+esc(nameOf(d))+' · <span class="ml-n">'+d.n+'</span></div><div class="ml-sub">'+esc(subOf(d,nameOf(d)))+'</div></div>';
      return el;
    });
  globe.controls().autoRotate = true;
  // 自转角速度随相机高度自适应：让地表在屏幕上的像素移动速度恒定
  // （与 gpu_enhanced 页同公式：屏幕速度 v = (ω/距地心高度)·(H/2)/tan(fov/2)，要 v 恒定需 ω ∝ 高度；
  // 参考默认 altitude=1.5 时速度 0.35；缩放越近转得越慢，拉远则加快）
  var SPIN_REF_ALT=1.5, SPIN_REF_SPEED=0.35, SPIN_MAX_ALT=2.0;
  function spinFor(alt){ var a=(alt==null?SPIN_REF_ALT:alt); if(a>SPIN_MAX_ALT) a=SPIN_MAX_ALT; return Math.max(0.004, SPIN_REF_SPEED*(a/SPIN_REF_ALT)); }
  globe.controls().autoRotateSpeed = spinFor(1.5);
  globe.controls().enableDamping = true;
  // 全部城市标签始终显示（不再按相机距离裁剪），并启动防碰撞自适应
  globe.controls().addEventListener('change', function(){
    if(!globe) return;
    var a; try{ a=globe.pointOfView().altitude; }catch(e){ return; }
    globe.controls().autoRotateSpeed = spinFor(a);
  });
  startLabelFit();
  var canvas = globe.renderer().domElement;
  var down = null;
  canvas.addEventListener('pointerdown', function(e){ down = { x: e.clientX, y: e.clientY }; });
  canvas.addEventListener('pointerup', function(e){
    if(!down) return;
    var moved = Math.sqrt(Math.pow(e.clientX-down.x, 2) + Math.pow(e.clientY-down.y, 2));
    down = null;
    if(moved > 6) return;
    var r = canvas.getBoundingClientRect();
    var c = pickCity(e.clientX-r.left, e.clientY-r.top);
    if(c) selectCity(c, true);
  });
}
// 屏幕坐标 -> 地球坐标，再取角距最近的城市；命中范围约 6°，且天然排除地球背面
function pickCity(px, py){
  if(!globe || !globe.toGlobeCoords) return null;
  var p = globe.toGlobeCoords(px, py);
  if(!p) return null;
  var best = null, bd = Infinity;
  for(var i=0;i<cities.length;i++){
    var c = cities[i];
    if(c.lat==null || c.lon==null) continue;
    var d = angularDist(c.lat, c.lon, p.lat, p.lng);
    if(d < bd){ bd = d; best = c; }
  }
  return (best && bd <= 6) ? best : null;
}
var angularDist = Visitor.angularDist;
function setPoints(){ if(globe) globe.pointsData(cities.filter(function(c){ return c.lat!=null && c.lon!=null; })); }
function updateLabel(){ if(!globe) return; var d; if(allLabels){ d=cities.filter(function(c){ return c.lat!=null && c.lon!=null; }).map(function(c){ return Object.assign({}, c); }); } else { d = (selCity && selCity.lat!=null) ? [Object.assign({}, selCity)] : []; } globe.htmlElementsData(d); }
var labelRAF=0,labelLast=0;
function labelItems(){ var els=document.querySelectorAll('.map-label'), arr=[]; for(var i=0;i<els.length;i++){ var el=els[i], d=el.__d||{}; if(d.lat==null||d.lon==null) continue; var hi=(typeof isMe==='function'&&isMe(d))?1e9:0; arr.push({el:el, lat:d.lat, lon:d.lon, pri:isSel(d)?1e10:(hi||(d.n||0)), sizeKey:(nameOf(d)+'|'+subOf(d)).length}); } return arr; }
function fitLabels(){ if(!globe||!allLabels) return; if(window.LabelCollide) LabelCollide.fit(globe, labelItems(), {altitude:0.06, hideClass:"gl-hide", overlap:0.2, cell:40, expand:14}); }
function startLabelFit(){ if(labelRAF) return; labelRAF=requestAnimationFrame(function cb(){ labelRAF=requestAnimationFrame(cb); var now=Date.now(); if(now-labelLast<140) return; labelLast=now; fitLabels(); }); }
function stopLabelFit(){ if(labelRAF){ cancelAnimationFrame(labelRAF); labelRAF=0; } var els=document.querySelectorAll('.map-label'); for(var i=0;i<els.length;i++) els[i].classList.remove('gl-hide'); }
function updateRings(){ if(globe) globe.ringsData(selCity && selCity.lat!=null ? [{lat:selCity.lat, lng:selCity.lon}] : []); }
function flyTo(lat,lon){
  if(!globe||lat==null||lon==null) return;
  globe.controls().autoRotate=false;
  var tLat = Math.max(-82, Math.min(82, lat - 15));
  globe.pointOfView({lat:tLat, lng:lon, altitude:1.5}, 500);
  clearTimeout(flyTo._t);
  flyTo._t=setTimeout(function(){ globe.controls().autoRotate=true; }, 1000);
}

function selectCity(c, doScroll){
  if(!c) return;
  var opening = expandPanel();
  flyTo(c.lat,c.lon);
  selCity=c; selKey=rowKey(c);
  setPoints(); updateLabel(); updateRings(); applySelection();
  if(doScroll){
    if(opening) setTimeout(function(){ scrollCityToCenter(c); }, 330);
    else scrollCityToCenter(c);
  }
}
function selectVisit(v){ flyTo(v.lat,v.lon); }
function scrollCityToCenter(c){
  var list=document.getElementById('list');
  var rows=list.querySelectorAll('.row[data-kind="city"]');
  for(var i=0;i<rows.length;i++){
    var cc=cities[+rows[i].getAttribute('data-i')];
    if(cc && rowKey(cc)===rowKey(c)){
      var lr=list.getBoundingClientRect(), rr=rows[i].getBoundingClientRect();
      list.scrollTop += (rr.top-lr.top) - (lr.height-rr.height)/2;
      break;
    }
  }
}
function cityForMe(){
  if(!meData) return null;
  var k=rowKey(meData);
  for(var i=0;i<cities.length;i++){ if(rowKey(cities[i])===k) return cities[i]; }
  var mk=(meData.country||'')+'|'+(meData.city||'');
  for(var i=0;i<cities.length;i++){
    if((cities[i].country||'')+'|'+(cities[i].city||'')===mk) return cities[i];
  }
  return null;
}
function applySelection(){
  var list=document.getElementById('list');
  Array.prototype.forEach.call(list.querySelectorAll('.row[data-kind="city"]'), function(row){
    var c=cities[+row.getAttribute('data-i')];
    row.classList.toggle('sel', c && isSel(c));
  });
  var gps=document.getElementById('gps');
  var gc=document.getElementById('gps-corner');
  var mc=cityForMe();
  var on=!!(mc && selCity && rowKey(mc)===rowKey(selCity));
  if(gps) gps.classList.toggle('on', on);
  if(gc) gc.classList.toggle('on', on);
}

function renderList(){
  var list=document.getElementById('list');
  if(!cities.length && !(adminKey && adminVisits.length)){
    list.innerHTML='<div class="empty">'+(lang==='zh'?'还没有数据。':'No data yet.')+'</div>'; return;
  }
  var html='';
  cities.forEach(function(c,i){
    var nm=nameOf(c);
    html+='<div class="row" data-kind="city" data-i="'+i+'">'
      +'<span class="dot" style="background:'+colorFor(c.country)+'"></span>'
      +'<span class="t"><span class="n">'+esc(nm)+'</span> '
      +'<span class="s">'+esc(subOf(c,nm))+'</span></span>'
      +'<span class="c">'+c.n+'</span></div>';
  });
  if(adminKey && adminVisits.length){
    html+='<div class="sec">'+(lang==='zh'?'访客明细':'Visitor log')+'</div>';
    adminVisits.slice(0,200).forEach(function(v,i){
      html+='<div class="row" data-kind="visit" data-i="'+i+'">'
        +'<span class="dot" style="background:'+colorFor(v.country)+'"></span>'
        +'<span class="t"><span class="n">'+esc(nameOf(v))+'</span>'
        +'<span class="s">'+full(v.ts)+' · '+esc(v.path||'')+'</span></span></div>';
    });
  }
  list.innerHTML=html;
  Array.prototype.forEach.call(list.querySelectorAll('.row'), function(row){
    row.addEventListener('click', function(){
      var i=+row.getAttribute('data-i');
      if(row.getAttribute('data-kind')==='city') selectCity(cities[i], false); else selectVisit(adminVisits[i]);
    });
  });
  applySelection();
}

function renderSub(){
  var countries={}; cities.forEach(function(c){ if(c.country) countries[c.country]=1; });
  document.getElementById('sub').textContent=(lang==='zh'
    ? cities.length+' 个城市 · 覆盖 '+Object.keys(countries).length+' 个国家/地区'
    : cities.length+' cities · '+Object.keys(countries).length+' countries/regions');
  var nt=document.getElementById('sub-note');
  if(nt) nt.textContent=(lang==='zh'
    ? '同一用户 30 分钟内多次访问仅统计 1 次'
    : 'Same user: visits within 30 min count once');
}
function cacheTake(k){ try{ var o=JSON.parse(sessionStorage.getItem('tc_'+k)||'null'); sessionStorage.removeItem('tc_'+k); if(o) return o.v; }catch(e){} return null; }
function renderMe(){
  var el=document.getElementById('mecity'); if(!el) return;
  el.textContent = meData ? nameOf(meData) : '';
}

async function refresh(){
  try{
    var st=cacheTake('stats');
    if(!st){ var rs=await fetch('/api/stats',{cache:'no-store'}); st=await rs.json(); }
    cities=(st.cities||[]).filter(function(c){return c.city || c.region;});
    document.getElementById('total').textContent=st.total!=null?st.total:'—';
    renderSub();
    setPoints();
    if(selCity){ for(var i=0;i<cities.length;i++){ if(rowKey(cities[i])===selKey){ selCity=cities[i]; break; } } }
    updateLabel(); updateRings();
  }catch(e){}
  if(adminKey){
    try{
      var rv=await fetch('/api/visits?limit=300',{cache:'no-store',headers:adminKey?{'X-Admin-Key':adminKey}:{}});
      if(rv.ok){ var vv=await rv.json(); adminVisits=(vv.visits||[]).filter(function(v){return v.lat!=null && v.lon!=null;}); }
    }catch(e){}
  }
  renderList();
}
async function refreshMe(){
  try{
    var me=cacheTake('me');
    if(!me){ var r=await fetch('/api/me',{cache:'no-store'}); if(!r.ok) return; me=await r.json(); }
    meData=me;
    renderMe();
    applySelection();
    setTimeout(function(){ document.getElementById('gps').click(); }, 100);
  }catch(e){}
}

// 面板手势：列表到顶/快速下滑/顶部非列表区下拉 → 收起；收起时上拖 chev → 展开
(function(){
  var panel=document.getElementById('panel'); if(!panel) return;
  var box=panel.querySelector('.panelbox');
  var list=document.getElementById('list');
  var chev=document.getElementById('chev');
  if(!box||!list) return;
  var suppress=false;
  function markSuppress(){ suppress=true; setTimeout(function(){ suppress=false; },400); }
  document.addEventListener('click',function(e){ if(suppress){ suppress=false; e.stopPropagation(); e.preventDefault(); } },true);
  function clearDrag(){ box.style.transition=''; box.style.transform=''; }
  var startY=null, startT=0, startScroll=0, lastY=0, lastT=0, extra=0, dragging=false, fromList=false;
  box.addEventListener('touchstart',function(e){
    if(e.touches.length!==1) return;
    fromList=list.contains(e.target);
    startY=e.touches[0].clientY; startT=Date.now(); lastY=startY; lastT=startT;
    startScroll=list.scrollTop; extra=0; dragging=false;
  },{passive:true});
  box.addEventListener('touchmove',function(e){
    if(startY==null) return;
    var y=e.touches[0].clientY; lastY=y; lastT=Date.now();
    var dy=y-startY;
    extra= fromList ? (dy-(startScroll-list.scrollTop)) : dy;
    var canDrag= fromList ? (list.scrollTop<=0 && extra>0) : (extra>0);
    if(canDrag){ dragging=true; box.style.transition='none'; box.style.transform='translateY('+Math.min(extra,box.clientHeight)+'px)'; }
    else if(dragging){ dragging=false; box.style.transition=''; box.style.transform=''; }
  },{passive:true});
  box.addEventListener('touchend',function(){
    if(startY==null) return;
    var dt=lastT-startT, dy=lastY-startY, v=dt>0?dy/dt:0;
    var thresh=fromList?72:48;
    var collapse=(dragging && extra>thresh) || (v>0.6 && dy>100);
    if(dragging) markSuppress();
    startY=null; dragging=false;
    box.style.transition=''; box.style.transform='';
    if(collapse) setCollapsed(true);
  },{passive:true});
  box.addEventListener('touchcancel',function(){ startY=null; dragging=false; clearDrag(); },{passive:true});

  if(chev){
    var cy0=null, cLast=0, cDrag=false;
    chev.addEventListener('touchstart',function(e){ if(e.touches.length!==1) return; cy0=e.touches[0].clientY; cLast=cy0; cDrag=false; },{passive:true});
    chev.addEventListener('touchmove',function(e){
      if(cy0==null) return;
      cLast=e.touches[0].clientY;
      var dy=cLast-cy0;
      if(dy<0){ cDrag=true; box.style.transition='none'; box.style.transform='translateY(calc(100% - '+Math.min(-dy,box.clientHeight)+'px))'; }
    },{passive:true});
    chev.addEventListener('touchend',function(){
      if(cy0==null) return;
      var dy=cLast-cy0;
      if(cDrag && -dy>60){ box.style.transition=''; box.style.transform=''; setCollapsed(false); markSuppress(); }
      else { box.style.transition=''; box.style.transform=''; }
      cy0=null; cDrag=false;
    },{passive:true});
    chev.addEventListener('touchcancel',function(){ cy0=null; cDrag=false; clearDrag(); },{passive:true});
  }
})();
